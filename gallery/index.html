<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Галерея</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../CSS/style.css">
  <style>
    /* Стили для галереи */
    #gallery-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
      justify-content: center;
    }
    .gallery-item {
      width: 120px;
      text-align: center;
    }
    .gallery-avatar {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 8px;
    }
    .gallery-avatar img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
  <script>
    // Redirect to login if not authenticated
    if (!localStorage.getItem('token')) {
      window.location.href = '../index.html';
    }
  </script>
</head>
<body>
  <div id="gallery-container"></div>
  <script src="./gallery.js"></script>
</body>
</html>
